<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cerebrito en Movimiento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabecera + filtros por momento de la app + grilla de 100 escenarios; cada tarjeta = escenario oscuro y su ficha de uso */
:root{
  --night:#12040f; --surface:#1d0818; --stage:#2a0a22; --line:rgba(255,160,210,.16);
  --ink:#ffe6f3; --muted:#c99ab4; --pink:#f04f9d; --gold:#ffd76a;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--pink)}
.lede{margin:10px 0 0;color:var(--muted);max-width:62ch}
button{font:600 14px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .18s,border-color .18s,color .18s}
button:hover{background:rgba(240,79,157,.14);border-color:var(--pink)}
button:focus-visible,.stage:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.filters button{flex:none;font-size:13px;padding:7px 13px}
.filters button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.filters .n{font:500 11px var(--f-mono);opacity:.75;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0;
  content-visibility:auto;contain-intrinsic-size:auto 380px}
.stage{position:relative;aspect-ratio:1/1;max-width:100%;cursor:pointer;overflow:hidden;
  background:radial-gradient(circle at 50% 46%,#4a1238 0%,var(--stage) 48%,var(--night) 100%);
  display:grid;place-items:center;padding:16% 9% 7%}
.stage .cb{width:100%}
.num{position:absolute;top:11px;left:13px;font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.tag{font:600 11px var(--f-body);color:var(--pink);text-transform:uppercase;letter-spacing:.08em}
.meta{padding:13px 15px 15px;display:grid;gap:5px;flex:1}
.meta h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;line-height:1.15;text-wrap:balance}
.meta p{margin:0;color:var(--muted);font-size:13.5px}
.meta .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.dur{font:500 12px var(--f-mono);color:var(--gold)}
.meta button{padding:6px 12px;font-size:13px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--gold);color:#2a0a22;
  font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
textarea.fallback{width:100%;height:120px;font:12px var(--f-mono);background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:10px}
.paused .cb *,.off .cb *{animation-play-state:paused!important}
</style>
<style id="anim-css"></style>

<div class="wrap">
  <header>
    <div>
      <h1>Cerebrito <em>en movimiento</em></h1>
      <p class="lede">100 animaciones del personaje de Omni Voy en SVG + CSS, sin librerías, ordenadas por el momento de la app donde sirven. Toca un escenario para reiniciarla y usa «Copiar código» para pegarla.</p>
    </div>
    <button id="pause" type="button">Pausar todo</button>
  </header>
  <nav class="filters" id="filters" aria-label="Categorías"></nav>
  <section class="grid" id="grid" aria-label="Animaciones"></section>
</div>
<div class="toast" id="toast" role="status">Código copiado</div>

/* ---------- dibujo ---------- */

/* ---------- generador ---------- */
function gen(a,k){
  const P='.cb-'+k,d=a.d||3;let css='';const anim={},stat={};
  const add=(s,v)=>(anim[s]=anim[s]||[]).push(v), st=(s,v)=>stat[s]=(stat[s]||'')+v;
  const B=BODY[a.b||'bob'];
  if(B.o)st(`${P} .rig`,`transform-origin:${B.o};`);
  css+=kf(`${k}-b`,B.f.map(([p,y=0,r=0,sx=1,sy=1,x=0])=>[p,`transform:${T(y,r,sx,sy,x)}`]));
  add(`${P} .rig`,`${k}-b ${d}s ${B.e||'ease-in-out'} infinite`);
  css+=kf(`${k}-sh`,B.f.map(([p,y=0,r=0,sx=1])=>{let s=y>100?0:(1-Math.min(.5,Math.max(0,-y)/140))*Math.min(1,sx);return[p,`transform:scale(${s.toFixed(2)});opacity:${(.3+.7*s).toFixed(2)}`]}));
  add(`${P} .shadow`,`${k}-sh ${d}s ${B.e||'ease-in-out'} infinite`);
  for(const side of ['l','r']){
    let spec=a[side]||'relax',mult=1,phase=false;
    if(spec.includes('@')){[spec,mult]=spec.split('@');mult=+mult;}
    if(spec.endsWith('~')){phase=true;spec=spec.slice(0,-1);}
    const fr=ARM[spec],sg=side==='l'?1:-1,dur=+(d*mult).toFixed(2),dl=phase?` ${-dur/2}s`:'';
    css+=kf(`${k}-${side}`,fr.map(([p,v])=>[p,`transform:rotate(${sg*v}deg)`]));
    add(`${P} .arm-${side}`,`${k}-${side} ${dur}s ease-in-out${dl} infinite`);
    if(side==='r'&&a.pr){css+=kf(`${k}-pc`,fr.map(([p,v])=>[p,`transform:rotate(${v}deg)`]));add(`${P} .prop-c`,`${k}-pc ${dur}s ease-in-out${dl} infinite`);}
  }
  const base=new Set([...EV[a.e||'open'],...MV[a.m||'open']]);
  const sw=a.sw?new Set([...EV[a.sw.e||a.e||'open'],...MV[a.sw.m||a.m||'open']]):null;
  ALLV.forEach((c,i)=>{
    const def=c==='eyes-open'||c==='mouth-open',inB=base.has(c);
    if(!sw){if(inB!==def)st(`${P} .${c}`,`opacity:${inB?1:0};`);return;}
    const inS=sw.has(c),[s0,s1]=[a.sw.a,a.sw.b];
    if(inB&&inS){if(!def)st(`${P} .${c}`,'opacity:1;');}
    else if(!inB&&!inS){if(def)st(`${P} .${c}`,'opacity:0;');}
    else{const on=inB?1:0;css+=kf(`${k}-v${i}`,[[`0%,${s0-4}%,${s1+4}%,100%`,`opacity:${on}`],[`${s0}%,${s1}%`,`opacity:${1-on}`]]);add(`${P} .${c}`,`${k}-v${i} ${d}s infinite`);}
  });
  if(a.e==='big')st(`${P} .eyes-open`,'transform:scale(1.15);');
  if([...base,...(sw||[])].includes('eyes-dizzy'))css+=`${P} .eyes-dizzy .sp{transform-box:fill-box;transform-origin:center;animation:${k}-sp 1.2s linear infinite}\n`+kf(`${k}-sp`,[['to','transform:rotate(360deg)']]);
  add(`${P} .blink`,`cb-blink ${Math.max(3,d)}s infinite`);
  if(a.m==='talk')add(`${P} .mouth-open`,`cb-talk ${a.slow?2.6:1.6}s linear infinite`);
  if(a.pu){const p=PUP[a.pu];css+=kf(`${k}-pu`,p.f.map(([q,v])=>[q,`transform:translate(${v})`]));add(`${P} .pupils`,`${k}-pu ${p.d||d}s ${p.e||'ease-in-out'} infinite`);}
  if(a.br==='up')st(`${P} .brows`,'transform:translateY(-14px);');
  if(a.br==='raise'){css+=kf(`${k}-br`,[['0%,100%','transform:translateY(0)'],['30%,70%','transform:translateY(-14px)']]);add(`${P} .brows`,`${k}-br ${d}s ease-in-out infinite`);}
  if(a.br==='sad'||a.br==='det'){st(`${P} .brows`,'opacity:0;');st(`${P} .brows-${a.br}`,'opacity:1;');}
  if(a.ch==='blush'){css+=kf(`${k}-ch`,[['0%,100%','opacity:.8;transform:scale(1)'],['50%','opacity:1;transform:scale(1.12)']]);add(`${P} .cheeks`,`${k}-ch 1.6s ease-in-out infinite`);}
  const fx={in:'',out:'',back:''};
  (a.fx||[]).forEach(spec=>{const i=spec.indexOf(':'),n=i<0?spec:spec.slice(0,i),arg=i<0?undefined:spec.slice(i+1);

  let rules='';
  const sels=new Set([...Object.keys(stat),...Object.keys(anim)]);
  sels.forEach(s=>rules+=`${s}{${stat[s]||''}${anim[s]?`animation:${anim[s].join(',')};`:''}}\n`);
  return{css:rules+css,fx,prop:a.pr?PROPS[a.pr]:''};
}

/* ---------- construir ---------- */
const items=[];let gi=0;
CATS.forEach(([ck,cl,list])=>list.forEach(it=>{
  if(typeof it==='string'){const o=O[it];items.push({k:it,cat:ck,cl,t:o.t,u:o.u,d:o.d,css:o.css('.cb-'+it),fx:{in:o.in||'',out:o.out||'',back:o.back||''},prop:''});}
  else{const k='g'+(++gi);const g=gen(it,k);items.push({k,cat:ck,cl,t:it.t,u:it.u,d:it.d||3,css:g.css,fx:g.fx,prop:g.prop});}
}));
if(items.length!==100)console.warn('Total',items.length);

const grid=document.getElementById('grid');
let all=BASE,html='';
items.forEach((a,i)=>{
  all+=a.css+'\n';
  html+=`<article class="card" data-cat="${a.cat}" data-i="${i}"><div class="stage" tabindex="0" role="button" aria-label="Reiniciar ${esc(a.t)}"><span class="num">${String(i+1).padStart(3,'0')}</span><div class="cb cb-${a.k}">${brain('cb-'+a.k,a.fx,a.prop)}</div></div>
  <div class="meta"><span class="tag">${a.cl}</span><h2>${esc(a.t)}</h2><p>${esc(a.u)}</p><div class="row"><span class="dur">${a.d} s</span><button type="button" data-i="${i}">Copiar código</button></div></div></article>`;
});
document.getElementById('anim-css').textContent=all;
grid.innerHTML=html;

/* filtros */
const nav=document.getElementById('filters');
const counts={};items.forEach(a=>counts[a.cat]=(counts[a.cat]||0)+1);
nav.innerHTML=`<button type="button" data-f="all" aria-pressed="true">Todas<span class="n">100</span></button>`+CATS.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="false">${l}<span class="n">${counts[k]}</span></button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  grid.querySelectorAll('.card').forEach(c=>c.hidden=!(b.dataset.f==='all'||c.dataset.cat===b.dataset.f));});

/* pausar lo que no se ve */
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('off',!e.isIntersecting)),{rootMargin:'120px'});
grid.querySelectorAll('.card').forEach(c=>{c.classList.add('off');io.observe(c);});

/* reiniciar y copiar */
const restart=st=>{const cb=st.querySelector('.cb');cb.replaceWith(cb.cloneNode(true));};
grid.addEventListener('click',e=>{
  const b=e.target.closest('button[data-i]');
  if(b){const a=items[+b.dataset.i];copy(`<!-- Cerebrito Omni Voy · ${a.t} -->\n<style>\n${BASE}${a.css}\n</style>\n<div class="cb cb-${a.k}" style="width:220px">\n${brain('cb-'+a.k,a.fx,a.prop)}\n</div>`,b);return;}
  const st=e.target.closest('.stage');if(st)restart(st);
});
grid.addEventListener('keydown',e=>{const st=e.target.closest('.stage');if(st&&(e.key==='Enter'||e.key===' ')){e.preventDefault();restart(st);}});
const toast=document.getElementById('toast');
function show(m){toast.textContent=m;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),1600);}
function copy(text,btn){
  const fb=()=>{const m=btn.closest('.meta');let ta=m.querySelector('textarea');
    if(!ta){ta=document.createElement('textarea');ta.className='fallback';ta.readOnly=true;m.appendChild(ta);}
    ta.value=text;ta.focus();ta.select();show('Selecciona y copia el código');};
  try{navigator.clipboard.writeText(text).then(()=>show('Código copiado'),fb);}catch(e){fb();}
}
const pb=document.getElementById('pause');
const setP=v=>{document.body.classList.toggle('paused',v);pb.textContent=v?'Reproducir todo':'Pausar todo';};
pb.addEventListener('click',()=>setP(!document.body.classList.contains('paused')));
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  const s=document.getElementById('anim-css');s.textContent=s.textContent.replace('@media (prefers-reduced-motion:reduce){.cb *{animation:none!important}}','');setP(true);}
})();
</script>
